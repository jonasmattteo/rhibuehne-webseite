name: Webseite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Pages-Konfiguration ermitteln
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Astro-Build
        run: npm run build
        env:
          # Eigene Domain → base_path ist leer, sonst /<repository>
          SITE: ${{ steps.pages.outputs.origin }}
          BASE: ${{ steps.pages.outputs.base_path || '/' }}
          # Passwort für den Mitgliederbereich (Settings → Secrets → Actions)
          MITGLIEDER_PASSWORT: ${{ secrets.MITGLIEDER_PASSWORT }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
